server {
    listen 80;
    server_name localhost;

    # СТАТИКА В S3 — Nginx её НЕ РАЗДАЁТ
    # Статические файлы загружаются напрямую из S3:
    # https://storage.yandexcloud.net/<BUCKET_NAME>/static/

    # API проксируется на backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Админка проксируется на backend
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Корневой путь — редирект на API
    location / {
        return 302 /api/;
    }
}