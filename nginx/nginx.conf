server {
    listen 80;
    server_tokens off;

    # Увеличиваем лимит размера загружаемых файлов
    client_max_body_size 10M;

    # ========== СТАТИКА БЭКЕНДА ==========
    # Отдельные блоки для конкретных папок (приоритет выше)
    location /static/admin/ {
        alias /var/html/static/admin/;
        try_files $uri $uri/ =404;
    }

    location /static/rest_framework/ {
        alias /var/html/static/rest_framework/;
        try_files $uri $uri/ =404;
    }

    # Общий блок для остальной статики бэкенда
    location /static/ {
        alias /var/html/static/;
        try_files $uri $uri/ =404;
    }

    # ========== МЕДИАФАЙЛЫ ==========
    location /media/ {
        alias /var/html/media/;
        try_files $uri $uri/ =404;
        # Добавляем заголовки для кэширования
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== ПРОКСИ ДЛЯ API И АДМИНКИ ==========
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # ========== ФРОНТЕНД ==========
    # Корневой location — обслуживает фронтенд
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}