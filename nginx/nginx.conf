server {
    listen 80;
    server_name localhost;

    # Корневая директория для фронтенда
    root /usr/share/nginx/html;
    index index.html;

    # Основной location — обслуживает фронтенд и его статику
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ВСЯ статика бэкенда (админка, rest_framework и т.д.)
    # Обрабатывает все запросы к /static/, кроме тех, что относятся к фронтенду
    location /static/ {
        alias /var/html/static/;
    }

    # Медиафайлы бэкенда
    location /media/ {
        alias /var/html/media/;
    }

    # Прокси для API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Прокси для админки Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}