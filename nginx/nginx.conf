server {
    listen 80;
    server_name localhost;

    # Корневая директория для фронтенда
    root /usr/share/nginx/html;
    index index.html;

    # Основной location — обслуживает фронтенд и его статику
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Блок для статики бэкенда — только если файл не найден в папке фронтенда
    location /static/ {
        # Сначала проверяем, есть ли файл в папке фронтенда
        try_files $uri @backend_static;
    }

    # Внутренний блок для статики бэкенда
    location @backend_static {
        alias /var/html/static/;
        # Добавляем внутренний редирект, чтобы Nginx не искал файлы в корне
        internal;
    }

    # Медиафайлы бэкенда
    location /media/ {
        alias /var/html/media/;
    }

    # Прокси для API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Прокси для админки Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}