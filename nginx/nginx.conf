server {
    listen 80;
    server_name localhost;

    # Корневая директория для фронтенда
    root /usr/share/nginx/html;
    index index.html;

    # Основной location — обслуживает фронтенд и его статику
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Блоки для статики бэкенда (с более высоким приоритетом)
    # Обрабатывают только конкретные пути, не мешая фронтенду
    location /static/admin/ {
        alias /var/html/static/admin/;
    }

    location /static/rest_framework/ {
        alias /var/html/static/rest_framework/;
    }

    # Если у бэкенда есть другие статические директории, добавьте их аналогично
    # Например:
    # location /static/drf_yasg/ {
    #     alias /var/html/static/drf_yasg/;
    # }

    # Медиафайлы бэкенда
    location /media/ {
        alias /var/html/media/;
    }

    # Прокси для API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Прокси для админки Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}