server {
    listen 80;
    server_name localhost;

    # Корневой location — отдаем статические файлы фронтенда
    location / {
        root /usr/share/nginx/html;  # Путь к собранному фронтенду внутри контейнера nginx
        try_files $uri $uri/ /index.html;  # Важно для SPA (роутинг на клиенте)
        index index.html;
    }

    # API и админка проксируются на backend (как у вас и было, это верно)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect http://backend:8000/ /;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # (Опционально) Если бэкенд отдает медиа/статические файлы через /media/ или /static/
    location /media/ {
        proxy_pass http://backend:8000;
    }
}