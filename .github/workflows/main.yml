name: Main workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend
  IMAGE_GATEWAY: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0 flake8-isort==6.0.0

      - name: Test with flake8
        run: python -m flake8 backend/ --ignore=E501,W291,W292,W293,I001,I003,I004,F401,E123,E301

  build_and_push_backend:
    name: Push Docker image to DockerHub (backend)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

  build_and_push_frontend:
    name: Push Docker image to DockerHub (frontend)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  build_and_push_gateway:
    name: Push Docker image to DockerHub (gateway)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: |
            ${{ env.IMAGE_GATEWAY }}:latest
            ${{ env.IMAGE_GATEWAY }}:${{ github.sha }}

  get_infra_outputs:
    runs-on: ubuntu-latest
    needs: 
      - build_and_push_backend
      - build_and_push_frontend
      - build_and_push_gateway
    outputs:
      host: ${{ steps.terraform_outputs.outputs.host }}
      url: ${{ steps.terraform_outputs.outputs.url }}

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_yc_service_account_key_file: /tmp/key.json
      TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_yc_zone: ${{ secrets.YC_ZONE }}
      TF_VAR_storage_access_key: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
      TF_VAR_storage_secret_key: ${{ secrets.YC_STORAGE_SECRET_KEY }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_vm_user: ${{ secrets.VM_USER }}
      TF_VAR_app_bucket_name: ${{ secrets.APP_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create service account key file
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /tmp/key.json

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.YC_TFSTATE_BUCKET }}" \
            -backend-config="access_key=${{ secrets.YC_STORAGE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.YC_STORAGE_SECRET_KEY }}"

      - name: Read Terraform outputs
        id: terraform_outputs
        run: |
          echo "host=$(terraform output -raw external_ip)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw kittygram_url)" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: 
      - get_infra_outputs
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to server
        env:
          HOST: ${{ needs.get_infra_outputs.outputs.host }}
          VM_USER: ${{ secrets.VM_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          # Настройка SSH с использованием ed25519 ключа
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Добавление хоста в known_hosts
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          # Создание директории на сервере
          ssh -o StrictHostKeyChecking=no "$VM_USER@$HOST" "sudo mkdir -p /opt/kittygram && sudo chown $VM_USER:$VM_USER /opt/kittygram"
          
          # Копирование docker-compose.production.yml на сервер
          scp -o StrictHostKeyChecking=no docker-compose.production.yml "$VM_USER@$HOST:/opt/kittygram/docker-compose.production.yml"
          
          # Создание .env файла на сервере
          ssh -o StrictHostKeyChecking=no "$VM_USER@$HOST" "cat > /opt/kittygram/.env" << EOF
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DB_HOST=postgres
          DB_PORT=5432
          SECRET_KEY=$DJANGO_SECRET_KEY
          DEBUG=False
          ALLOWED_HOSTS=$HOST,localhost,127.0.0.1
          DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
          EOF
          
          # Деплой приложения
          ssh -o StrictHostKeyChecking=no "$VM_USER@$HOST" << 'DEPLOY_SCRIPT'
          set -e
          cd /opt/kittygram
          
          # Логин в Docker Hub
          echo "$DOCKERHUB_PASSWORD" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          
          # Скачивание образов и запуск контейнеров
          sudo docker compose -f docker-compose.production.yml pull
          sudo docker compose -f docker-compose.production.yml up -d
          
          # Выполнение миграций и сборка статики
          sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput
          sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
          
          # Проверка статуса контейнеров
          sudo docker compose -f docker-compose.production.yml ps
          DEPLOY_SCRIPT

  auto_tests:
    runs-on: ubuntu-latest
    needs: 
      - deploy
      - get_infra_outputs
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pyyaml

      - name: Run API and DockerHub tests
        env:
          KITTYGRAM_DOMAIN: ${{ needs.get_infra_outputs.outputs.url }}
        run: pytest

  telegram-notify:
    runs-on: ubuntu-latest
    needs: 
      - auto_tests
      - get_infra_outputs
    if: success()
    steps:
      - name: Send Telegram notification
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_TO }}" \
            -d text="✅ Kittygram успешно развернут! %0A🌐 Сайт: ${{ needs.get_infra_outputs.outputs.url }} %0A📦 Репозиторий: ${{ github.repository }} %0A👤 Автор: ${{ github.actor }}"