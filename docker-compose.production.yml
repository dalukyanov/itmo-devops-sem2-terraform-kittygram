version: '3.8'

services:
  postgres:
    image: postgres:13.10
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/kittygram_backend:latest
    env_file: .env
    depends_on:
      - postgres
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/kittygram_frontend:latest
    env_file: .env
    depends_on:
      - backend
    restart: always
    volumes:
      - frontend_static:/static  # Добавляем том для статики

  gateway:
    image: ${DOCKERHUB_USERNAME}/kittygram_gateway:latest
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_static:/usr/share/nginx/html:ro  # Монтируем статику фронтенда
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:
  frontend_static:  # Объявляем новый том